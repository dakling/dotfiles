# Kitty Terminal Configuration
# Recommended settings for improved usability

# Font settings
font_family      Fira Code
font_size        11.0
bold_font        auto
italic_font      auto

# Cursor settings
cursor_shape     beam
cursor_blink     yes
cursor_blink_interval 500

# Window settings
window_padding_width  5
window_padding_height 5
startup_mode          windowed
window_size_width     800
window_size_height    600

# Tab settings
tab_bar_style         powerline
tab_bar_edge          bottom
tab_flicker           0
tab_activity          none

# Scrollback settings
scrollback_lines      10000
scrollback_pager      less

# Color scheme (using One Dark theme)
foreground            #abb2bf
background            #282c34
selection_foreground  #282c34
selection_background  #abb2bf
url_color             #61afef

# Normal colors (8 colors)
color0                #282c34   # black
color1                #e06c75   # red
color2                #98c379   # green
color3                #e5c07b   # yellow
color4                #61afef   # blue
color5                #c678dd   # magenta
color6                #56b6c2   # cyan
color7                #abb2bf   # white

# Bright colors (8 colors)
color8                #5c6370   # bright black
color9                #e06c75   # bright red
color10               #98c379   # bright green
color11               #e5c07b   # bright yellow
color12               #61afef   # bright blue
color13               #c678dd   # bright magenta
color14               #56b6c2   # bright cyan
color15               #abb2bf   # bright white

# Mouse settings
mouse_hide_wait       300
double_click_interval 300
triple_click_interval 300

# Enable ligatures (for fonts that support it)
enable_ligatures      yes

# Bell settings
bell_on_urgent        no
# Startup options
remember_window_size  yes
confirm_os_window_close 0

# Shell configuration - start tmux if not already in a session
shell /bin/sh -c '[ -z "$TMUX" ] && exec tmux new || exec "$SHELL"'

# Miscellaneous
allow_remote_control  yes
