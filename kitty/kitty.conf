# Kitty Terminal Configuration
# Recommended settings for improved usability

# Font settings
font_family      Fira Code
font_size        11.0
bold_font        auto
italic_font      auto

# Cursor settings
cursor_shape     beam
cursor_blink     yes
cursor_blink_interval 500

# Window settings
window_padding_width  5
window_padding_height 5

# Tab settings
tab_bar_style         powerline
tab_bar_edge          bottom

# Scrollback settings
scrollback_lines      10000
scrollback_pager      less

# Color scheme (using One Dark theme)
foreground            #abb2bf
background            #282c34
selection_foreground  #282c34
selection_background  #abb2bf
url_color             #61afef

# Normal colors (8 colors)
color0                #282c34   # black
color1                #e06c75   # red
color2                #98c379   # green
color3                #e5c07b   # yellow
color4                #61afef   # blue
color5                #c678dd   # magenta
color6                #56b6c2   # cyan
color7                #abb2bf   # white

# Bright colors (8 colors)
color8                #5c6370   # bright black
color9                #e06c75   # bright red
color10               #98c379   # bright green
color11               #e5c07b   # bright yellow
color12               #61afef   # bright blue
color13               #c678dd   # bright magenta
color14               #56b6c2   # bright cyan
color15               #abb2bf   # bright white

# Mouse settings
mouse_hide_wait       300

# Enable ligatures (for fonts that support it)
enable_ligatures      yes

# Bell settings
# Startup options
remember_window_size  yes
confirm_os_window_close 0

# Shell configuration
shell /bin/zsh

# Miscellaneous
allow_remote_control  yes

# Send explicit escape sequences for alt+hjkl so tmux can bind them
map alt+h send_text all \x1bh
map alt+j send_text all \x1bj
map alt+k send_text all \x1bk
map alt+l send_text all \x1bl

# Send explicit escape sequences for alt+shift+hjkl so tmux can bind them
map alt+shift+h send_text all \x1bH
map alt+shift+j send_text all \x1bJ
map alt+shift+k send_text all \x1bK
map alt+shift+l send_text all \x1bL

