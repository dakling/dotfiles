# Doom Emacs inspired tmux profile.
# Goal: keep tmux feeling modal, leader-driven, and visually close to Doom
# without pretending that a terminal multiplexer can become Emacs.

##### Core #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -s escape-time 10
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g repeat-time 400
set -g display-time 2500
set -g status-interval 5
set -g prefix C-Space
set -g prefix2 C-b
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-keys vi
set -g xterm-keys on
setw -g automatic-rename on
set -g allow-rename off
setw -g aggressive-resize on
set -g renumber-windows on

unbind C-b
bind -n M-Space switch-client -T prefix

# Terminals cannot pass macOS Command directly to tmux. Instead, map
# Cmd+Ctrl+h/j/k/l in the terminal emulator to these private sequences.
# set -s user-keys[0] "\033[1000u"
# set -s user-keys[1] "\033[1001u"
# set -s user-keys[2] "\033[1002u"
# set -s user-keys[3] "\033[1003u"
# bind -n User0 select-pane -L
# bind -n User1 select-pane -D
# bind -n User2 select-pane -U
# bind -n User3 select-pane -R
# bind -n C-M-h select-pane -L
# bind -n C-M-j select-pane -D
# bind -n C-M-k select-pane -U
# bind -n C-M-l select-pane -R

##### Sensible tmux defaults #####

bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# bind -r C-h resize-pane -L 5
# bind -r C-j resize-pane -D 5
# bind -r C-k resize-pane -U 5
# bind -r C-l resize-pane -R 5

bind H swap-pane -s "{left-of}"
bind J swap-pane -s "{down-of}"
bind K swap-pane -s "{up-of}"
bind L swap-pane -s "{right-of}"

##### Copy mode #####

bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line
bind -T copy-mode-vi 0 send -X start-of-line
bind -T copy-mode-vi ^ send -X start-of-line
bind -T copy-mode-vi $ send -X end-of-line
bind -T copy-mode-vi i send -X 
# exit copy mode
bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi a send-keys -X cancel
bind -T copy-mode-vi o send-keys -X cancel
bind -T copy-mode-vi I send-keys -X cancel
bind -T copy-mode-vi A send-keys -X cancel
bind -T copy-mode-vi O send-keys -X cancel

##### Doom-like leader tree #####

bind ? display-message "Leader: C-Space. Optional alias: M-Space if your terminal sends Meta-Space. Main groups: w=windows, b=buffers, p=projects."
bind x display-popup -E -w 85% -h 80% -d "#{pane_current_path}"
bind : command-prompt
bind q detach-client
bind R source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind o switch-client -T doom-ai
bind w switch-client -T doom-window
bind b switch-client -T doom-buffer
bind p switch-client -T doom-project
bind z resize-pane -Z

bind -T doom-window h select-pane -L
bind -T doom-window j select-pane -D
bind -T doom-window k select-pane -U
bind -T doom-window l select-pane -R
bind -T doom-window s split-window -v -c "#{pane_current_path}"
bind -T doom-window v split-window -h -c "#{pane_current_path}"
bind -T doom-window S split-window -vf -c "#{pane_current_path}"
bind -T doom-window V split-window -hf -c "#{pane_current_path}"
bind  - split-window -v -c "#{pane_current_path}"
bind  | split-window -h -c "#{pane_current_path}"
bind -T doom-window _ split-window -vf -c "#{pane_current_path}"
# bind -T doom-window | split-window -hf -c "#{pane_current_path}"
bind -T doom-window c kill-pane
bind -T doom-window d kill-pane
bind -T doom-window q kill-pane
bind -T doom-window o kill-pane -a
bind -T doom-window m resize-pane -Z
bind -T doom-window = select-layout tiled
bind -T doom-window w display-panes
bind -T doom-window W choose-tree -Z
bind -T doom-window r command-prompt -I "#W" "rename-window '%%'"
bind -T doom-window H swap-pane -s "{left-of}"
bind -T doom-window J swap-pane -s "{down-of}"
bind -T doom-window K swap-pane -s "{up-of}"
bind -T doom-window L swap-pane -s "{right-of}"

bind -T doom-buffer b choose-tree -Z
bind -T doom-buffer n next-window
bind -T doom-buffer p previous-window
bind -T doom-buffer l last-window
bind -T doom-buffer c new-window -c "#{pane_current_path}"
bind -T doom-buffer d kill-window
bind -T doom-buffer k kill-window
bind -T doom-buffer q kill-window
bind -T doom-buffer . choose-window
bind -T doom-buffer r command-prompt -I "#W" "rename-window '%%'"

bind -T doom-project p choose-tree -Z
bind -T doom-project l switch-client -l
bind -T doom-project c display-popup -E -w 85% -h 80% -d "#{pane_current_path}" "~/.dotfiles/binCustom/tmux-project-session"
bind -T doom-project f display-popup -E -w 85% -h 80% -d "#{pane_current_path}" "~/.dotfiles/binCustom/tmux-project-session"
bind -T doom-project n command-prompt -p "session name" "new-session -A -s '%%' -c '#{pane_current_path}'"
bind -T doom-project r command-prompt -I "#S" "rename-session '%%'"
bind -T doom-project d kill-session

bind e run "tmux capture-pane -S 0 -p -J > /tmp/tmux-edit && tmux new-window 'nvim /tmp/tmux-edit'"

##### Neovim integration #####

bind -T doom-window N run "tmux send-keys -t . 'nvim .' Enter"

# Synchronized panes — type in all panes at once
bind -T doom-window y setw synchronize-panes \; display-message "synchronize-panes #{?synchronize-panes,ON,OFF}"

##### AI tool quick-launch #####

bind -T doom-ai o split-window -hf -c "#{pane_current_path}" \; send-keys "opencode" Enter
bind -T doom-ai c split-window -hf -c "#{pane_current_path}" \; send-keys "claude" Enter
bind -T doom-ai x split-window -hf -c "#{pane_current_path}" \; send-keys "codex" Enter

##### Doom-palenight inspired chrome #####

set -g status-position bottom
set -g status-style "fg=#a6accd,bg=#292d3e"
set -g message-style "fg=#292d3e,bg=#ffcb6b,bold"
set -g mode-style "fg=#292d3e,bg=#89ddff,bold"
set -g display-panes-colour "#676e95"
set -g display-panes-active-colour "#ffcb6b"

set -g pane-border-status top
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g pane-border-format "#{?pane_active,#[fg=#82aaff bold],#[fg=#676e95]} #{pane_index} #{pane_current_command} #{b:pane_current_path} #(TMUX_CLAUDE_STATUS_PANES=\"#{pane_id}\" ~/.local/bin/tmux-claude-status.sh #{window_index} #{session_name} #{?pane_active,pane-active,pane-inactive} staleness) "

set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[fg=#292d3e,bg=#82aaff,bold] #S #[fg=#a6accd,bg=#292d3e]#{?client_prefix, LEADER,}#{?pane_in_mode, COPY,} "
set -g window-status-separator ""
set -g window-status-format "#[fg=#676e95,bg=#292d3e] #I:#W#{?window_flags, #{window_flags},}#(~/.local/bin/tmux-claude-status.sh #{window_index} #{session_name} window-inactive activity) "
set -g window-status-current-format "#[fg=#292d3e,bg=#c792ea,bold] #I:#W#{?window_zoomed_flag, [Z],}#(~/.local/bin/tmux-claude-status.sh #{window_index} #{session_name} window-active activity) #[fg=#a6accd,bg=#292d3e,nobold]"
set -g status-right "#[fg=#89ddff]#{b:pane_current_path} #[fg=#c3e88d]#{pane_current_command} #[fg=#ffcb6b]%Y-%m-%d #[fg=#c792ea]%H:%M "

set -g popup-border-style "fg=#c792ea"
set -g popup-style "bg=#1e2030"


set -g @plugin 'mrjones2014/smart-splits.nvim'

# Optional configurations with their default values if omitted:

set -g @smart-splits_no_wrap '1' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'C-M-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-M-j' #  --"--
set -g @smart-splits_move_up_key    'C-M-k' #  --"--
set -g @smart-splits_move_right_key 'C-M-l' #  --"--

set -g @smart-splits_resize_left_key  'M-H' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-J' #  --"--
set -g @smart-splits_resize_up_key    'M-K' #  --"--
set -g @smart-splits_resize_right_key 'M-L' #  --"--

set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
